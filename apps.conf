# Apps flashed by flash_all.sh, one per line: name, OTA slot (from partitions.csv), repo dir.
# The dir is relative to this repo or absolute; <NAME>_DIR in .env overrides it.
# The launcher lists every slot with a valid image, so this is all it needs to know.
# This is the catalogue; which of these go on the watch is APPS in .env (default: all).
# Slots are fixed per app, so reflashing one app never moves the others. Free slots:
# ota_3..ota_6 (partitions.csv).
maze   ota_0  ../ESP32Watch-Maze
doom   ota_1  ../ESP32Watch-Doom
fluid  ota_2  ../ESP32Watch-Fluid
